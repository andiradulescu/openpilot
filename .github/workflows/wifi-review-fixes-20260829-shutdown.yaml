name: apply wifi shutdown ordering fix
on:
  push:
    branches: [wifi-review-fixes-20260829-shutdown]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: wifi-no-networkmanager-refactor
        fetch-depth: 0

    - name: Apply fix
      shell: bash
      run: |
        set -euxo pipefail
        git show origin/wifi-review-fixes-20260829-shutdown:.tmp/apply_wifi_shutdown_order.py > /tmp/apply_wifi_shutdown_order.py
        python3 /tmp/apply_wifi_shutdown_order.py
